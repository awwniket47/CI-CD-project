name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Git SHA to roll back to (leave empty for previous deployment)'
        required: false
        type: string

jobs:
  rollback:
    name: Rollback to Previous Version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Execute Rollback on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            DEPLOY_LOG="$HOME/deployments.log"
            TARGET_SHA="${{ github.event.inputs.sha }}"

            if [ -z "$TARGET_SHA" ]; then
              if [ ! -f "$DEPLOY_LOG" ] || [ $(wc -l < "$DEPLOY_LOG") -lt 2 ]; then
                echo "❌ No previous deployment found"
                exit 1
              fi
              TARGET_SHA=$(sed -n '2p' "$DEPLOY_LOG" | awk '{print $2}')
              echo "Rolling back to previous: $TARGET_SHA"
            else
              echo "Rolling back to: $TARGET_SHA"
            fi

            cd "$HOME/retailmind"

            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/retailmind-backend:$TARGET_SHA \
              || (echo "❌ Backend image not found" && exit 1)
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/retailmind-frontend:$TARGET_SHA \
              || (echo "❌ Frontend image not found" && exit 1)

            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
            export DOMAIN=${{ secrets.EC2_HOST }}
            export ROLLBACK_SHA=$TARGET_SHA

            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            echo "Waiting 20s..."
            sleep 20

            curl -sf http://localhost:8000/api/health \
              && echo "✅ Rollback to $TARGET_SHA successful!" \
              || (echo "❌ Health check failed" && docker compose logs backend --tail=30 && exit 1)

            TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
            echo "$TIMESTAMP $TARGET_SHA (rollback)" | cat - "$DEPLOY_LOG" | head -10 > "$DEPLOY_LOG.tmp"
            mv "$DEPLOY_LOG.tmp" "$DEPLOY_LOG"